services:
  edzkool:
    build:
      context: ./Edzkool/backend
      dockerfile: Dockerfile
    container_name: edzkool_backend
    restart: unless-stopped
    env_file:
      - ./Edzkool/backend/.env.docker
    environment:
      - SQLITE_DB_PATH=/app/data/edzkool_db.sqlite3
    volumes:
      - edzkool_data:/app/data
      - edzkool_media:/app/media
    networks:
      - app_network

  edvoyage:
    build:
      context: ./Edvoyage/backend/EdVoyage
      dockerfile: Dockerfile
    container_name: edvoyage_backend
    restart: unless-stopped
    env_file:
      - ./Edvoyage/backend/EdVoyage/.env.docker
    environment:
      - SQLITE_DB_PATH=/app/data/db.sqlite3
    volumes:
      - edvoyage_data:/app/data
      - edvoyage_media:/app/media
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - edzkool
      - edvoyage
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    container_name: certbot_client
    restart: "no"
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network

volumes:
  edzkool_data:
  edzkool_media:
  edvoyage_data:
  edvoyage_media:
  certbot_etc:
  certbot_var:
  certbot_www:

networks:
  app_network:
    name: app_network
    driver: bridge
