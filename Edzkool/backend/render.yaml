services:
  - type: web
    name: edzkool-api
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn edvoayge.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # Django core
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "edzkool.onrender.com,edvoyage-backup-cursor-2.onrender.com,edvoyage.work.gd,edzkool.publicvm.com"
      - key: DJANGO_ADMIN_URL
        value: "edzkool-admin-panel/"
      - key: WEB_CONCURRENCY
        value: 2              # 2 workers — safe ceiling for Render's 512MB free plan

      # AWS S3 Media Storage
      - key: USE_S3
        value: "true"
      - key: AWS_STORAGE_BUCKET_NAME
        value: edvoyage-edzkool-media
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false        # Set manually in Render Dashboard → Environment
      - key: AWS_SECRET_ACCESS_KEY
        sync: false        # Set manually in Render Dashboard → Environment

      # Email — AWS SES
      - key: EMAIL_HOST
        value: email-smtp.us-east-1.amazonaws.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: office@bfuturetechnologies.com

      # OpenAI
      - key: OPENAI_API_KEY
        sync: false